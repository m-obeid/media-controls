# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Publish to GitHub

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build extension
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.10

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y \
            gnome-shell gettext zip unzip git nodejs npm curl \
            libglib2.0-dev

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install project dependencies
        run: pnpm install

      - name: Build extension
        run: pnpm run build

      - name: Save ZIPs for validation and publishing
        uses: actions/upload-artifact@v7
        with:
          name: extension-zips
          path: dist/builds/*.zip
          if-no-files-found: error

  publish:
    name: Check and upload release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Download built ZIPs
        uses: actions/download-artifact@v8
        with:
          name: extension-zips
          path: dist/builds

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'

      - name: Verify Python SSL
        run: python3 -c 'import ssl; print(ssl.OPENSSL_VERSION)'

      - name: Find the extension ZIP
        id: package
        shell: bash
        run: |
          shopt -s nullglob
          zips=(dist/builds/*.zip)
          if (( ${#zips[@]} != 1 )); then
            printf 'Expected exactly one ZIP; found %d\n' "${#zips[@]}" >&2
            printf '%s\n' "${zips[@]}" >&2
            exit 1
          fi
          echo "path=${zips[0]}" >> "$GITHUB_OUTPUT"

      - name: Shexli CI
        uses: 3v1n0/shexli-ci@v1
        with:
          path: ${{ steps.package.outputs.path }}
          on-resolved: warn

      - name: Attach ZIP to release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/builds/*.zip
